name: Build Android APK for Pydroid 3 Web

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17 (Capacitor 6 Compatible)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Accept Android SDK Licenses (Preinstalled SDK)
        run: |
          SDK_MGR="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          else
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: 4. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 6. Install Capacitor LTS (6.2.0)
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: 7. Build Web Application Assets
        run: |
          npm run build

      - name: 8. Initialize & Sync Capacitor Android + Custom App Icon
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -d "resources/android-res" ]; then
            cp -rf resources/android-res/* android/app/src/main/res/
          fi
          npx cap sync android

      - name: 9. Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: 10. Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Find and Verify Generated APK
        run: |
          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found"
            exit 1
          fi
          cp "$APK_FILE" output-apk/app-debug.apk
          ls -lh output-apk/app-debug.apk

      - name: 12. Upload APK Artifact (Download on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: Pydroid3-Android-APK
          path: output-apk/app-debug.apk
          retention-days: 30

      - name: 13. Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/app-debug.apk
          tag_name: v1.0.0
          name: Pydroid 3 Web Android APK v1.0.0
          body: |
            🎉 **Pydroid 3 Web Android APK**
            Tải tệp `app-debug.apk` đính kèm bên dưới và cài đặt trực tiếp trên điện thoại Android của bạn!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
